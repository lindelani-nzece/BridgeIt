<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#007aff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles.css" />
  <title>BridgeIt List</title>
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>BridgeIt List</h1>
      <button id="clearCompletedBtn" type="button" class="secondary-btn">Clear Done</button>
    </header>

    <form id="itemForm" class="add-form">
      <input id="itemInput" type="text" placeholder="Add an item..." autocomplete="off" />
      <button id="addBtn" type="submit">Add</button>
    </form>

    <ul id="itemList" class="item-list"></ul>
  </main>

  <script type="module" src="./ui.js"></script>
</body>
</html>
